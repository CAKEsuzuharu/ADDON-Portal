name: Publish streamer job roles
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: addon-streamer-job-roles
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export streamer job role labels
        env:
          STREAMERS_CSV_URL: ${{ secrets.STREAMERS_CSV_URL }}
        run: |
          if [ -z "$STREAMERS_CSV_URL" ]; then
            echo "::notice::STREAMERS_CSV_URL is not configured. Skipping."
            exit 0
          fi
          node scripts/publish-streamer-roles.mjs
      - name: Commit only on changes
        run: |
          if ! git diff --quiet -- data/streamer-roles.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/streamer-roles.json
            git commit -m 'Update streamer job role labels'
            git push
          fi
